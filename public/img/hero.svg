  <!-- taczka -->
  <g transform="translate(560 372)">
    <path d="M-30 10 L60 10 L46 46 L-14 46 Z" fill="#ffd23f"/>
    <circle cx="-16" cy="56" r="12" fill="#1b1c1f"/>
    <rect x="44" y="40" width="34" height="6" fill="#1b1c1f" transform="rotate(-30 44 40)"/>
  </g>

  <!-- pachołek -->
  <g transform="translate(270 390)">
    <path d="M10 46 L22 0 L34 0 L46 46 Z" fill="#ff7a00"/>
    <rect x="15" y="16" width="26" height="7" fill="#ffffff"/><rect x="11" y="31" width="34" height="7" fill="#ffffff"/>
    <rect x="4" y="44" width="48" height="6" fill="#1b1c1f"/>
