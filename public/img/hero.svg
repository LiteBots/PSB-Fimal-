<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520">
  <!-- tło: płaskie koła -->
  <circle cx="420" cy="210" r="190" fill="#ffffff" opacity=".10"/>
  <circle cx="520" cy="90" r="46" fill="#ffd23f"/>
  <!-- ziemia -->
  <rect x="0" y="440" width="640" height="80" fill="#b8000f"/>
  <rect x="0" y="436" width="640" height="8" fill="#1b1c1f"/>

  <!-- dźwig -->
  <rect x="88" y="70" width="14" height="366" fill="#1b1c1f"/>
  <rect x="40" y="70" width="300" height="14" fill="#1b1c1f"/>
  <rect x="40" y="84" width="40" height="26" fill="#1b1c1f"/>
  <path d="M95 70 L120 40 L145 70" fill="none" stroke="#1b1c1f" stroke-width="8"/>
  <rect x="268" y="84" width="4" height="96" fill="#1b1c1f"/>
  <!-- płyta OSB na haku -->
  <rect x="200" y="180" width="140" height="26" fill="#d9a35b"/>
  <rect x="210" y="186" width="18" height="5" fill="#b9853f"/><rect x="240" y="195" width="26" height="5" fill="#b9853f"/>
  <rect x="280" y="186" width="14" height="5" fill="#b9853f"/><rect x="306" y="196" width="22" height="5" fill="#b9853f"/>

  <!-- budynek z bloczków -->
  <g>
    <rect x="300" y="250" width="250" height="186" fill="#ffffff"/>
    <g fill="#f1f1f1">
      <rect x="300" y="280" width="250" height="4"/><rect x="300" y="314" width="250" height="4"/>
      <rect x="300" y="348" width="250" height="4"/><rect x="300" y="382" width="250" height="4"/>
      <rect x="300" y="416" width="250" height="4"/>
    </g>
    <rect x="330" y="290" width="62" height="62" fill="#1b1c1f"/>
    <rect x="359" y="290" width="4" height="62" fill="#ffffff"/><rect x="330" y="319" width="62" height="4" fill="#ffffff"/>
    <rect x="452" y="330" width="64" height="106" fill="#e30613"/>
    <circle cx="504" cy="384" r="4" fill="#ffffff"/>
    <!-- dach -->
    <path d="M286 254 L425 170 L564 254 Z" fill="#1b1c1f"/>
    <rect x="490" y="186" width="26" height="46" fill="#1b1c1f"/>
  </g>

  <!-- paleta z cegłami -->
  <g transform="translate(110 360)">
    <rect x="0" y="66" width="150" height="10" fill="#8a5a2b"/>
    <rect x="8" y="76" width="16" height="10" fill="#8a5a2b"/><rect x="67" y="76" width="16" height="10" fill="#8a5a2b"/><rect x="126" y="76" width="16" height="10" fill="#8a5a2b"/>
    <g fill="#c4572e">
      <rect x="4" y="46" width="46" height="18"/><rect x="52" y="46" width="46" height="18"/><rect x="100" y="46" width="46" height="18"/>
      <rect x="28" y="26" width="46" height="18"/><rect x="76" y="26" width="46" height="18"/>
      <rect x="52" y="6" width="46" height="18"/>
    </g>
  </g>

  <!-- worki cementu -->
  <g transform="translate(16 340)">
    <rect x="0" y="40" width="74" height="56" rx="10" fill="#c9ccd1"/>
    <rect x="0" y="58" width="74" height="18" fill="#e30613"/>
    <rect x="10" y="0" width="64" height="48" rx="10" fill="#dfe1e4"/>
    <rect x="10" y="16" width="64" height="16" fill="#e30613"/>
